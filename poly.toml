[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/*.onnx",
  # Brand/asset SVGs are hand-tuned; poly must not reflow them. ~keep
  "**/*.svg",
  "target/**",
  "dist/**",
  "node_modules/**",
  "vendor/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  "**/pnpm-lock.yaml",
]

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[tools.actionlint]
enabled = true

[lint.uncomment]
enabled = true
code_only = false
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[per-file-ignores]
"basemind.toml" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
# Python uses `#` comments idiomatically; the uncomment hook targets Rust/TOML. ~keep
"python/**" = ["comment", "doc-comment"]
# The docs site is JS/CSS/MDX; comments there are idiomatic, not stray Rust/TOML cruft. ~keep
"docs-site/**" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  "**/pnpm-lock.yaml",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  "**/pnpm-lock.yaml",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "docs-site/dist/**",
  "docs-site/node_modules/**",
  "docs-site/.astro/**",
  "**/pnpm-lock.yaml",
] }
cargo = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate", "ai-rulez-plugin-verify"]
