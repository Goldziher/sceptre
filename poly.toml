[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/*.onnx",
  "target/**",
  "dist/**",
  "node_modules/**",
  "vendor/**",
  "**/assets/**",
  "**/tests/data/**",
  # Vendored OCR corpus submodule — third-party content, not ours to lint. ~keep
  "test_documents/**",
]

[lint.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[fmt.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[lint.uncomment]
enabled = true
code_only = false
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "HACK", "WORKAROUND", "NOTE"]

[per-file-ignores]
"basemind.toml" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = ["**/*.lock", "**/*.onnx", "target/**", "**/assets/**", "**/tests/data/**", "test_documents/**"] }
fmt = { exclude = ["**/*.lock", "**/*.onnx", "target/**", "**/assets/**", "**/tests/data/**", "test_documents/**"] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "**/*.onnx", "target/**", "**/assets/**", "**/tests/data/**", "test_documents/**"] }
cargo = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate", "ai-rulez-plugin-verify"]
