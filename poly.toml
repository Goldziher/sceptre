[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/*.onnx",
  # Brand/asset SVGs are hand-tuned; poly must not reflow them. ~keep
  "**/*.svg",
  "target/**",
  "dist/**",
  "node_modules/**",
  "vendor/**",
  "**/assets/**",
  "**/tests/data/**",
  "website/dist/**",
  "website/node_modules/**",
  "website/.astro/**",
  "**/package-lock.json",
]

[lint.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[fmt.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[lint.uncomment]
enabled = true
code_only = false
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "HACK", "WORKAROUND", "NOTE"]

[per-file-ignores]
"basemind.toml" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
# Python uses `#` comments idiomatically; the uncomment hook targets Rust/TOML. ~keep
"python/**" = ["comment", "doc-comment"]
# The docs site is JS/CSS/MDX; comments there are idiomatic, not stray Rust/TOML cruft. ~keep
"website/**" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "website/dist/**",
  "website/node_modules/**",
  "website/.astro/**",
  "**/package-lock.json",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "website/dist/**",
  "website/node_modules/**",
  "website/.astro/**",
  "**/package-lock.json",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/*.onnx",
  "**/*.svg",
  "target/**",
  "**/assets/**",
  "**/tests/data/**",
  "website/dist/**",
  "website/node_modules/**",
  "website/.astro/**",
  "**/package-lock.json",
] }
cargo = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate", "ai-rulez-plugin-verify"]
