[package]
name = "sceptre-tools"
description = "Dev-only model export/conversion tooling for sceptre (Rust-first, candle-based)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "sceptre-tools"
path = "src/main.rs"

[features]
default = []
# Enables the `snapshot` subcommand, which runs the real sceptre pipeline (ort ~keep
# backend + model download) to regenerate the sceptre-snapshot golden fixtures. ~keep
ort = ["dep:sceptre", "dep:serde_json"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# This ort-bundled pin now agrees with the sceptre-cli default, so a workspace-wide build
# no longer unifies two ONNX Runtime provisioning strategies into one feature set. ~keep
sceptre = { workspace = true, optional = true, features = ["ort-bundled", "download"] }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
