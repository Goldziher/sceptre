[workspace]
members = ["crates/sceptre", "crates/sceptre-cli", "tools"]
default-members = ["crates/sceptre", "crates/sceptre-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
license = "MIT"
repository = "https://github.com/Goldziher/sceptre"
homepage = "https://github.com/Goldziher/sceptre"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics belong in tracing (stderr), not raw stdout/stderr writes; the CLI opts back in locally. ~keep
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[workspace.dependencies]
anstream = "1.0"
anstyle = "1.0"

anyhow = "1.0"
assert_cmd = "2.2"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
criterion = { version = "0.8", features = ["html_reports"] }

hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "pnm"] }
# CRAFT postprocess geometry: connected components, morphological dilation, min-area-rect (ADR 0013). ~keep
imageproc = { version = "0.27", default-features = false }
ndarray = "0.17"
num_cpus = "1.17"
once_cell = "1.21"

# default-features = false keeps ort off its prebuilt-binary auto-download; provisioning is chosen
# explicitly by the sceptre `ort-bundled` / `ort-dynamic` features (xberg pattern, ADR 0012). ~keep
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-18"] }
predicates = "3.1"
rayon = "1.12"

rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }

sceptre = { path = "crates/sceptre", version = "0.3.0", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The tract-onnx frontend is CPU-only and WASM-safe; the top-level tract facade bundles GPU backends. ~keep
tract-onnx = { version = "0.23.4", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
