<rect x="434" y="322" width="720" height="4" fill="url(#amberRule)"/>
<text x="436" y="384" fill="#f4dfb2" font-family="'Courier New', ui-monospace, monospace" font-size="26" font-weight="700" letter-spacing="0.5">EasyOCR's accuracy. Rust's speed and footprint.</text>
<text x="436" y="442" fill="#b9832a" font-family="'Courier New', ui-monospace, monospace" font-size="22" font-weight="700" letter-spacing="1.5">~2.8× FASTER · ~3× LESS MEMORY · PARITY ACCURACY</text>
<text x="60" y="560" fill="#f5b301" font-family="'Courier New', ui-monospace, monospace" font-size="24" font-weight="700" letter-spacing="4" opacity="0.85">CRAFT + gen2 CRNN · ONNX · library · CLI · MCP</text>
<rect width="1280" height="640" fill="url(#grain)" opacity="0.42"/>
