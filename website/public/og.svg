<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="sceptre — EasyOCR's accuracy, Rust's speed and footprint">
<title>sceptre</title>
<defs>
<linearGradient id="warmBeam" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#ffe6a3" stop-opacity="0.30"/>
<stop offset="42%" stop-color="#8a5a12" stop-opacity="0.08"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</linearGradient>
<linearGradient id="amberRule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#f5b301" stop-opacity="0"/>
<stop offset="10%" stop-color="#f5b301" stop-opacity="0.9"/>
