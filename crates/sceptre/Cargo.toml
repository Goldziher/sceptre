[package]
name = "sceptre"
description = "Rust reimplementation of EasyOCR (CRAFT detection + gen2 CRNN recognition) over ONNX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sceptre"
readme = "README.md"
keywords = ["ocr", "text-recognition", "easyocr", "craft", "onnx"]
categories = ["computer-vision", "text-processing"]
# The vendored corpus images are 14 MiB, over the crates.io package limit, and no consumer of the
# published crate reads them — `bench::load_corpus_image` resolves them under CARGO_MANIFEST_DIR at
# runtime, so they are a repository fixture rather than crate content. The ground-truth transcripts
# beside them are the same kind of thing: only the Python benchmark tooling reads them. ~keep
exclude = ["tests/data/images/**", "tests/data/ground_truth/**"]

# docs.rs has no network in the build sandbox, so the `ort-bundled` prebuilt download
# cannot run there; document the dynamic + pure-Rust surface instead. ~keep
[package.metadata.docs.rs]
no-default-features = true
features = ["ort-dynamic", "tract", "download", "mcp"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "sceptre"

[features]
default = []
# Native ONNX Runtime backend for desktop and server (provisioning-agnostic). ~keep
ort = ["dep:ort"]
# ort with a prebuilt ONNX Runtime fetched at build time — zero-config native (xberg pattern). ~keep
ort-bundled = ["ort", "ort?/download-binaries", "ort?/tls-rustls"]
# ort loading libonnxruntime at runtime via ORT_DYLIB_PATH — for targets without a prebuilt. ~keep
ort-dynamic = ["ort", "ort?/load-dynamic"]
# Pure-Rust ONNX backend for WASM and Android. ~keep
tract = ["dep:tract-onnx"]
# Pure-Rust native-tensor backend. ~keep
candle = ["dep:candle-core", "dep:candle-nn", "dep:prost"]
# Runtime model download, caching, and sha256 verification from Hugging Face. ~keep
download = ["dep:hf-hub"]
# MCP (rmcp) server surface. ~keep
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]
# Exposes the crate-internal hot paths through the `bench` seam module for criterion (ADR 0015). ~keep
bench = []
# Execution-provider support for `model.accelerator`. These compile in the Rust-side EP struct
# only; the ONNX Runtime build must also carry the provider. The pyke prebuilt for
# aarch64-apple-darwin is CoreML-enabled by construction, so on macOS `ort-coreml` is enough. ~keep
ort-coreml = ["ort", "ort?/coreml"]
ort-directml = ["ort", "ort?/directml"]
ort-cuda = ["ort", "ort?/cuda"]
# GPU devices for the candle backend. `candle-metal` needs the macOS/iOS SDK; `candle-cuda`
# compiles candle's CUDA kernels and needs the CUDA toolkit on the build machine. ~keep
candle-metal = ["candle", "candle-core?/metal", "candle-nn?/metal"]
candle-cuda = ["candle", "candle-core?/cuda", "candle-nn?/cuda"]

[dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
image = { workspace = true }
imageproc = { workspace = true }
ndarray = { workspace = true }
once_cell = { workspace = true }
ort = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tract-onnx = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num_cpus = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "detect"
harness = false
required-features = ["bench"]

[[bench]]
name = "recognize"
harness = false
required-features = ["bench"]
