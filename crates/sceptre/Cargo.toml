[package]
name = "sceptre"
description = "Rust reimplementation of EasyOCR (CRAFT detection + gen2 CRNN recognition) over ONNX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The tract backend is still a stub, so cargo-machete would otherwise flag its
# optional dep as unused until that implementation lands. ~keep
[package.metadata.cargo-machete]
ignored = ["tract-onnx"]

[lib]
name = "sceptre"

[features]
default = []
# Native ONNX Runtime backend for desktop and server (provisioning-agnostic). ~keep
ort = ["dep:ort"]
# ort with a prebuilt ONNX Runtime fetched at build time — zero-config native (xberg pattern). ~keep
ort-bundled = ["ort", "ort?/download-binaries", "ort?/tls-rustls"]
# ort loading libonnxruntime at runtime via ORT_DYLIB_PATH — for targets without a prebuilt. ~keep
ort-dynamic = ["ort", "ort?/load-dynamic"]
# Pure-Rust ONNX backend for WASM and Android. ~keep
tract = ["dep:tract-onnx"]
# Pure-Rust native-tensor backend. ~keep
candle = []
# Runtime model download, caching, and sha256 verification from Hugging Face. ~keep
download = ["dep:hf-hub", "dep:sha2"]
# MCP (rmcp) server surface. ~keep
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
dirs = { workspace = true }
hf-hub = { workspace = true, optional = true }
image = { workspace = true }
imageproc = { workspace = true }
ndarray = { workspace = true }
num_cpus = { workspace = true }
ort = { workspace = true, optional = true }
rayon = { workspace = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tract-onnx = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
