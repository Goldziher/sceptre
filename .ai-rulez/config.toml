version = "4.0"
name = "easyocr-rs"
description = "Rust reimplementation of EasyOCR — CRAFT detection + gen2 CRNN recognition over ONNX, as a library + CLI + MCP server."
gitignore = true

presets = ["claude", "codex"]

builtins = ["rust", "cicd", "documentation", "default-commands"]

[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "npx"
args = ["-y", "ai-rulez@latest", "mcp"]
