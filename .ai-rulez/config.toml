version = "4.0"
name = "sceptre"
description = "Rust reimplementation of EasyOCR — CRAFT detection + gen2 CRNN recognition over ONNX, as a library + CLI + MCP server."
gitignore = true

presets = ["claude", "codex"]

compact = true
[header]
style = "minimal"

builtins = ["rust", "cicd", "documentation", "default-commands"]

[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
path = "modules/cicd"
merge_strategy = "local-override"

[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "npx"
args = ["-y", "ai-rulez@latest", "mcp"]

[defaults]
effort = "medium"

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true
