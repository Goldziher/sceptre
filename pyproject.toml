[project]
name = "sceptre-tools"
version = "0.1.0"
description = "Dev-only fallback model export and golden-fixture tooling for sceptre."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com" }]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["python/sceptre_rs_tools"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]
# Heavy, opt-in export path: torch + easyocr drive the .pth->ONNX export and the
# golden-fixture generation; onnxruntime validates each export against torch. Not
# installed by default. ~keep
export = ["torch", "easyocr", "onnx", "onnxruntime", "numpy"]
# Opt-in PDF rasterization dev tooling (see sceptre_rs_tools.rasterize, ADR 0034 follow-up).
# `pillow` renders pypdfium2's bitmap output to PNG; kept out of `export` since that group is
# the heavy torch/easyocr path and rasterization needs neither. ~keep
corpus = ["pypdfium2>=4", "pillow>=10"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
