name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The image the parity and end-to-end lanes OCR. Committed as a plain blob (the LFS
  # corpus lives in the test_documents submodule, which those lanes do not need). ~keep
  SAMPLE_IMAGE: crates/sceptre/tests/data/images/english.png

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "mcp"]
        include:
          # backend_agreement.rs is `#![cfg(all(feature = "ort", feature = "tract"))]`, so
          # without a leg that enables both backends at once it never compiles anywhere. ~keep
          - os: ubuntu-latest
            features: "ort-bundled,tract,download"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify the CLI ONNX Runtime feature matrix
        # Cheap (`cargo tree --locked`: no build, no network) and the only check that a
        # published `cargo install` resolves to a runnable provisioning strategy. One leg
        # is enough — feature resolution does not vary by host OS. ~keep
        if: runner.os == 'Linux' && matrix.features == ''
        run: ./scripts/verify-features.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --tests --features "${{ matrix.features }}" -- -D warnings
      - name: Test
        run: cargo test --workspace --features "${{ matrix.features }}"
      - name: Build (release)
        run: cargo build --release --workspace --features "${{ matrix.features }}"

  install:
    name: cargo install (${{ matrix.install.label }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        install:
          # The three provisioning paths a user can actually take. The default must stay
          # self-contained; `ort-dynamic` must remain an additive override that needs no
          # --no-default-features; `tract` must resolve with no ort in the graph at all. ~keep
          - label: default
            args: ""
            e2e: true
          - label: ort-dynamic
            args: "--features ort-dynamic"
          - label: tract
            args: "--no-default-features --features tract,download"
    runs-on: ${{ matrix.os }}
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install from the workspace exactly as `cargo install sceptre-cli` would
        shell: bash
        run: cargo install --locked --path crates/sceptre-cli ${{ matrix.install.args }}

      - name: sceptre --version
        shell: bash
        run: sceptre --version

      # `--version` never constructs an ONNX Runtime session, so it passes even on a build
      # whose runtime cannot load — it would not have caught the dlopen panic that made every
      # default `cargo install` unusable. Only an end-to-end run exercises that path. ~keep
      - name: Cache Hugging Face models
        if: matrix.install.e2e && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ runner.os }}-${{ hashFiles('crates/sceptre/src/models/registry.rs') }}

      - name: End-to-end OCR over a committed image
        if: matrix.install.e2e && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sceptre models download --lang english
          sceptre run "${SAMPLE_IMAGE}" --lang english --format json > result.json
          grep -q '"text"' result.json
          echo "OCR produced $(grep -c '"text"' result.json) text field(s)"

  parity:
    name: Parity (${{ matrix.accelerator }} on ${{ matrix.os }})
    # Heavy: downloads the real models and runs real inference. Kept off pull requests —
    # the light `test` lanes already compile and skip the model-gated tests — but run on
    # main and on demand. A parity gate that only fires when someone remembers to dispatch
    # it does not defend the parity claim; the model cache makes repeat runs cheap. ~keep
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            accelerator: cpu
            features: "ort-bundled,download"
            cli_features: ""
          - os: macos-latest
            accelerator: cpu
            features: "ort-bundled,download"
            cli_features: ""
          - os: windows-latest
            accelerator: cpu
            features: "ort-bundled,download"
            cli_features: ""
          # CoreML proves the execution-provider registration path end to end. GitHub's
          # macOS runners are VMs with no Neural Engine, so this is NOT evidence about
          # on-device ANE numerics. No DirectML lane: the Windows runner has no GPU, so it
          # would fall back to the WARP software adapter and measure nothing real. No CUDA
          # lane: there is no GPU runner. ~keep
          - os: macos-latest
            accelerator: coreml
            features: "ort-bundled,ort-coreml,download"
            # Named through the library (`sceptre/ort-coreml`) rather than the CLI's own
            # `ort-coreml` passthrough so this lane keeps working if the CLI's feature
            # aliases are renamed. Cargo features are additive, so this lands on top of the
            # CLI default (ort-bundled + download) rather than replacing it — which matters,
            # because ort-coreml alone would enable `ort` with no prebuilt runtime to
            # link. ~keep
            cli_features: "sceptre/ort-coreml"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          # The registry file holds every pinned sha256, so this key is exact and
          # self-invalidating. The `revision` field is the floating string "main" and is
          # never sent to the Hub, so it is useless as a cache key. ~keep
          key: hf-${{ runner.os }}-${{ hashFiles('crates/sceptre/src/models/registry.rs') }}

      - name: Build the CLI
        shell: bash
        run: cargo build --release -p sceptre-cli --locked --features "${{ matrix.cli_features }}"

      - name: Resolve the built binary path
        # Windows produces sceptre.exe; name it explicitly rather than relying on the
        # MSYS bash shim to append the extension. ~keep
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "SCEPTRE=$(pwd)/target/release/sceptre.exe" >> "$GITHUB_ENV"
          else
            echo "SCEPTRE=$(pwd)/target/release/sceptre" >> "$GITHUB_ENV"
          fi

      - name: Pre-seed every model, serially, before anything reads the cache
        shell: bash
        run: |
          "$SCEPTRE" models download --all

      - name: Record the runtime this lane resolves to
        shell: bash
        run: |
          "$SCEPTRE" env --accelerator ${{ matrix.accelerator }} --format json | tee env.json

      - name: Golden parity suite
        if: matrix.accelerator == 'cpu'
        shell: bash
        env:
          SCEPTRE_REQUIRE_MODELS: "1"
        run: cargo test -p sceptre --features "${{ matrix.features }}" --test tier2_golden -- --nocapture 2>&1 | tee tier2_golden.log

      - name: End-to-end OCR through the requested execution provider
        # The golden fixtures are CPU fixtures, so a non-CPU lane asserts that the provider
        # registers and the pipeline runs — an explicitly requested provider that cannot
        # register is a hard error, so a silent CPU fallback cannot pass this step. ~keep
        if: matrix.accelerator != 'cpu'
        shell: bash
        run: |
          set -euo pipefail
          "$SCEPTRE" run "${SAMPLE_IMAGE}" \
            --lang english --accelerator ${{ matrix.accelerator }} --format json > result.json
          grep -q '"text"' result.json

      - name: Upload parity results
        # env.json records the resolved runtime; tier2_golden.log is the golden-suite
        # output on the CPU legs; result.json is the smoke-test output on the CoreML leg.
        # Kept per matrix leg so a failure on one OS/accelerator does not overwrite another. ~keep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}-${{ matrix.accelerator }}-${{ github.run_id }}
          path: |
            env.json
            tier2_golden.log
            result.json
          if-no-files-found: ignore
          retention-days: 14

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (benches)
        run: cargo clippy -p sceptre --all-targets --features bench -- -D warnings
      - name: Compile-check benches
        # Benches are compile-checked here, not perf-run; timing runs are manual. ~keep
        run: cargo check -p sceptre --benches --features bench

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The corpus resolution tests read capability-probe images from the
          # test_documents submodule; without it they resolve to None and fail. ~keep
          submodules: recursive
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python dev environment
        # Plain `uv sync` installs only the default dependency group; the heavy
        # torch/export group is optional and must be requested explicitly, so CI
        # skips it here on purpose. ~keep
        run: uv sync
      - name: Ruff check
        run: uv run ruff check python
      - name: Ruff format check
        run: uv run ruff format --check python
      - name: Pytest (pure harness logic)
        # The benchmark unit tests cover metrics, capability detection, report rendering,
        # and the regression gate without torch/easyocr or the release binary. ~keep
        run: uv run pytest python/tests -q

  # Opt-in head-to-head regression gate. Heavy (torch + easyocr + models + a release
  # binary) and its numbers are only comparable when the machine is not otherwise busy,
  # so it is workflow_dispatch ONLY — no schedule. Mirrors the SCEPTRE_REQUIRE_MODELS
  # opt-in discipline. ~keep
  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-${{ runner.os }}-${{ hashFiles('crates/sceptre/src/models/registry.rs') }}

      - name: Cache EasyOCR weights
        # EasyOCR fetches its own weights into ~/.EasyOCR through its own mechanism,
        # entirely separately from the Hugging Face cache. Cache only one of the two and
        # half the download cost of this job remains. ~keep
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: easyocr-${{ runner.os }}-

      - name: Install torch + easyocr (export group)
        run: uv sync --group export
      - name: Build release CLI (bundled ONNX Runtime + on-demand model download)
        run: cargo build --release -p sceptre-cli --no-default-features --features ort-bundled,download

      - name: Pre-seed every model, serially, before the harness fans out
        run: ./target/release/sceptre models download --all

      - name: Benchmark and assert regression floors
        # --assert fails the job on a floor breach. ~keep
        run: uv run python -m sceptre_rs_tools.benchmark --repeats 2 --assert

      - name: Upload the benchmark report
        # Without this the harness writes comparison.{json,md} and the runner discards
        # them, leaving nothing to diff a later run against via --baseline. ~keep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 90

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
