name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "mcp"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --tests --features "${{ matrix.features }}" -- -D warnings
      - name: Test
        run: cargo test --workspace --features "${{ matrix.features }}"
      - name: Build (release)
        run: cargo build --release --workspace --features "${{ matrix.features }}"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (benches)
        run: cargo clippy -p sceptre --all-targets --features bench -- -D warnings
      - name: Compile-check benches
        # Benches are compile-checked here, not perf-run; timing runs are manual. ~keep
        run: cargo check -p sceptre --benches --features bench

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python dev environment
        # Plain `uv sync` installs only the default dependency group; the heavy
        # torch/export group is optional and must be requested explicitly, so CI
        # skips it here on purpose. ~keep
        run: uv sync
      - name: Ruff check
        run: uv run ruff check python
      - name: Ruff format check
        run: uv run ruff format --check python

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
