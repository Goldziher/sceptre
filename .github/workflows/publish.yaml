name: Release

on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  # Key on the resolved tag, not github.ref: a tag push (refs/tags/vX) and a manual rerun ~keep
  # for the SAME tag carry different refs and would otherwise race. Never cancel a release ~keep
  # mid-flight — asset uploads and the crates.io dry-run should complete deterministically. ~keep
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_complete: ${{ steps.assets.outputs.release_complete }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $tag / version: $version"

      - name: Verify the workspace version matches the tag
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.version }}"
          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target" ]; then
            echo "::error::Cargo.toml [workspace.package].version ($cargo_version) does not match tag ($target)"
            exit 1
          fi
          echo "Workspace version matches tag: $target"

      # Cargo.toml pins the sceptre-cli -> sceptre dependency version separately in
      # [workspace.dependencies], so a version bump that only touches [workspace.package]
      # would ship a CLI that still resolves an old sceptre from crates.io. Fail loudly
      # rather than let that divergence reach a release. ~keep
      - name: Verify the sceptre dependency pin matches the workspace version
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.version }}"
          dep_version="$(grep -E '^sceptre = \{ path = "crates/sceptre"' Cargo.toml | grep -oE 'version = "[^"]+"' | head -1 | cut -d'"' -f2)"
          if [ -z "$dep_version" ]; then
            echo "::error::Could not find [workspace.dependencies].sceptre version pin in Cargo.toml"
            exit 1
          fi
          if [ "$dep_version" != "$target" ]; then
            echo "::error::[workspace.dependencies].sceptre version ($dep_version) does not match [workspace.package].version ($target)"
            exit 1
          fi
          echo "sceptre dependency pin matches workspace version: $target"

      - name: Detect an already-published crates.io version
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          crates_exists=false
          # sceptre-cli is published last (it depends on sceptre), so its presence at this ~keep
          # version means the whole set is already on crates.io — the job can be skipped. ~keep
          # crates.io answers 403 to a request carrying no User-Agent, which a bare `curl -f` ~keep
          # reads as "absent" for every version, so identify the caller and match on 200. ~keep
          # A 403/5xx/timeout leaves this false, which only costs an idempotent re-publish. ~keep
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: sceptre release workflow (https://github.com/xberg-io/sceptre)' \
            "https://crates.io/api/v1/crates/sceptre-cli/${version}" || echo 000)"
          echo "crates.io HTTP $status for sceptre-cli ${version}"
          if [ "$status" = "200" ]; then
            crates_exists=true
          fi
          echo "crates_exists=$crates_exists" >> "$GITHUB_OUTPUT"
          echo "crates.io already has sceptre-cli ${version}? $crates_exists"

      - name: Detect a COMPLETE existing release (all archives + checksums)
        id: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          release_complete=false
          # Treat the release as done only when the FULL asset set is present. A partial
          # draft (a builder failed or was cancelled) reports false so create-release + the
          # build matrix rerun and heal the gaps on a re-dispatch of the same tag. ~keep
          required=(
            "sceptre-x86_64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-apple-darwin.tar.gz"
            "sceptre-x86_64-pc-windows-msvc.zip"
            "sceptre_${version}_checksums.txt"
          )
          if gh release view "$tag" --json assets -q '.assets[].name' > /tmp/have.txt 2>/dev/null; then
            missing=0
            for asset in "${required[@]}"; do
              grep -qx "$asset" /tmp/have.txt || { echo "  missing: $asset"; missing=$((missing + 1)); }
            done
            [ "$missing" -eq 0 ] && release_complete=true
          fi
          echo "release_complete=$release_complete" >> "$GITHUB_OUTPUT"
          echo "Complete release already present? $release_complete"

  create-release:
    name: Create draft release
    needs: meta
    if: needs.meta.outputs.release_complete != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine prerelease flag
        id: prerelease
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          prerelease=false
          case "$tag" in
            *-rc.* | *-beta* | *-alpha*) prerelease=true ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Create as a DRAFT: the build matrix uploads binaries to it, but it stays hidden
      # until finalize promotes it — and finalize only runs once checksums (which requires
      # all platform binaries) succeeds. A failed platform build leaves a hidden draft, not
      # a live release with missing binaries (ADR 0020). Idempotent: an existing draft is
      # left untouched, so a re-dispatch of the same tag never re-creates or un-drafts it. ~keep
      - name: Ensure a draft release exists
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          title: ${{ needs.meta.outputs.tag }}
          notes: "Release ${{ needs.meta.outputs.tag }}"
          draft: "true"
          prerelease: ${{ steps.prerelease.outputs.prerelease }}

  build:
    name: Build ${{ matrix.triple }}
    needs: [meta, create-release]
    if: needs.meta.outputs.release_complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            os: macos-latest
          # No x86_64-apple-darwin: ort's `download-binaries` ships no prebuilt ONNX Runtime
          # for Intel macOS, so a self-contained build is impossible. Apple Silicon covers
          # macOS; Intel-mac users build from source. ~keep
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.triple }}
          install-llvm-cov: "false"
          cache-key-prefix: release-build-${{ matrix.triple }}

      # Install `task` so the workflow calls task targets, not raw cargo, per the
      # pipeline-standards task-runner rule. ~keep
      - uses: xberg-io/actions/install-task@v1

      - name: Build and package
        shell: bash
        run: task release:package TRIPLE=${{ matrix.triple }}

      - name: Smoke-test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          if [ "${{ matrix.triple }}" = "x86_64-pc-windows-msvc" ]; then
            archive="sceptre-${{ matrix.triple }}.zip"
            # Expand-Archive is a Windows program, so it reads DestinationPath as a Windows
            # path; mktemp returns an MSYS path (/tmp/...) that PowerShell resolves elsewhere.
            # Translate it with cygpath so extraction lands where bash then looks. ~keep
            powershell -Command "Expand-Archive -Path '$archive' -DestinationPath '$(cygpath -w "$dir")' -Force"
            "$dir/sceptre.exe" --version
          else
            archive="sceptre-${{ matrix.triple }}.tar.gz"
            tar xzf "$archive" -C "$dir"
            "$dir/sceptre" --version
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload archive to the release
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: ${{ env.ARCHIVE }}

  checksums:
    name: Generate checksums
    needs: [meta, build]
    if: needs.meta.outputs.release_complete != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
      - name: Verify all platform archives are present, then checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          expected=(
            "sceptre-x86_64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-unknown-linux-gnu.tar.gz"
            "sceptre-aarch64-apple-darwin.tar.gz"
            "sceptre-x86_64-pc-windows-msvc.zip"
          )
          gh release view "$tag" --json assets -q '.assets[].name' > /tmp/have.txt || true
          missing=0
          for asset in "${expected[@]}"; do
            grep -qx "$asset" /tmp/have.txt || { echo "::error::missing $asset"; missing=$((missing + 1)); }
          done
          [ "$missing" -eq 0 ] || { echo "::error::release incomplete ($missing archives missing)"; exit 1; }

          for asset in "${expected[@]}"; do
            gh release download "$tag" -p "$asset" -O "$asset"
          done
          sha256sum sceptre-*.tar.gz sceptre-*.zip | sort > "sceptre_${version}_checksums.txt"
          cat "sceptre_${version}_checksums.txt"

      - name: Upload checksums to the release
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: sceptre_${{ needs.meta.outputs.version }}_checksums.txt

  finalize:
    name: Publish GitHub release
    needs: [meta, checksums]
    if: always() && needs.meta.result == 'success' && needs.meta.outputs.release_complete != 'true' && needs.checksums.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # A hard gate before promotion: never un-draft a release missing an asset (ADR 0020).
      # `finalize-release` itself only flips the draft flag, so completeness is verified here
      # first, independently of `meta`'s own idempotency-only completeness probe. ~keep
      - name: Verify every release asset is present
        uses: xberg-io/actions/verify-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          min-size-bytes: "1"
          expected-assets: |
            sceptre-x86_64-unknown-linux-gnu.tar.gz
            sceptre-aarch64-unknown-linux-gnu.tar.gz
            sceptre-aarch64-apple-darwin.tar.gz
            sceptre-x86_64-pc-windows-msvc.zip
            sceptre_${{ needs.meta.outputs.version }}_checksums.txt

      - name: Promote the draft once every asset is present
        uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}

  publish-crates:
    name: Publish to crates.io
    needs: [meta, finalize]
    # crates.io is irreversible, so publish source only after the platform binaries built
    # and the GitHub release promoted — keeping the surfaces atomic across a partial failure
    # (ADR 0023). Skipped when this version is already on crates.io (idempotent re-runs).
    #
    # This job's steps MUST stay inline in this file, not behind a reusable workflow call:
    # crates.io Trusted Publishing binds the OIDC `job_workflow_ref` claim to this exact
    # workflow file, and delegating the job body elsewhere would break that trust. ~keep
    if: always() && needs.meta.outputs.crates_exists != 'true' && needs.finalize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - uses: xberg-io/actions/setup-rust@v1
        with:
          install-llvm-cov: "false"
          cache-key-prefix: release-publish-crates

      - name: Pre-warm the default-feature build before the irreversible step
        # `cargo publish -p sceptre-cli` runs a verification build with DEFAULT features,
        # which is `ort-bundled` — so it fetches an ONNX Runtime prebuilt from cdn.pyke.io
        # partway through publishing, after the GitHub release has already been promoted.
        # A CDN outage there strands the release half-published and unrecoverable.
        # `publish-crates` has no `--no-default-features` input, so this build cannot be
        # eliminated — only pre-warmed, so the same fetch during `cargo publish`'s own
        # verification build is cached and fast rather than a fresh, failure-prone one. ~keep
        run: cargo build -p sceptre-cli --locked

      # Handles crates.io OIDC auth, dependency-ordered publishing, index-propagation waits,
      # and idempotent skipping of an already-published version internally. ~keep
      - name: Publish sceptre then sceptre-cli (dependency order)
        uses: xberg-io/actions/publish-crates@v1
        with:
          crates: sceptre sceptre-cli
          version: ${{ needs.meta.outputs.version }}
