name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: github.repository == 'xberg-io/sceptre' && github.actor != 'dependabot[bot]'
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      setup-python: true
      python-version: "3.13"

  changelog:
    name: Changelog in sync
    # The docs changelog page is generated from CHANGELOG.md. This job is what makes that
    # true rather than aspirational: it catches a CHANGELOG.md edit that skipped the
    # regeneration. It lives here, not in ci-docs.yaml, because that workflow only fires on
    # docs-site/** and would never see the edit that causes the drift. ~keep
    if: github.repository == 'xberg-io/sceptre' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: xberg-io/actions/install-task@v1
      - run: task docs:changelog:check
