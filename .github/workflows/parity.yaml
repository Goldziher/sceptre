name: Parity

# Opt-in only: parity needs the LFS test corpus and multi-GB models, so it never runs
# on push/PR. Trigger it manually from the Actions tab. ~keep
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCEPTRE_REQUIRE_MODELS: "1"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Pull test corpus LFS blobs
        run: git -C test_documents lfs pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # TODO: provision the CRAFT + gen2 ONNX models into the Hugging Face hub cache
      # (~/.cache/huggingface/hub) here — the model repos/caching are not yet wired, so
      # SCEPTRE_REQUIRE_MODELS=1 will fail until this step lands. ~keep
      - name: Provision models
        run: echo "model provisioning into the Hugging Face cache is not yet wired"
      - name: Tier-2 golden parity
        run: cargo test -p sceptre --features ort,download --test tier2_golden
