name: CI Python

on:
  push:
    branches: [main]
    paths:
      - python/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci-python.yaml
  pull_request:
    branches: [main]
    paths:
      - python/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci-python.yaml
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    if: github.repository == 'xberg-io/sceptre' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.13"
          # Plain `uv sync` installs only the default dependency group; the heavy
          # torch/export group is optional and must be requested explicitly, so CI
          # skips it here on purpose. The action's own default additionally passes
          # `--no-install-project`, which would leave `python -m sceptre_rs_tools...`
          # invocations broken with ModuleNotFoundError, so it is overridden here. ~keep
          install-command: "uv sync"

      - name: Ruff check
        run: uv run ruff check python

      - name: Pytest (pure harness logic)
        # The benchmark unit tests cover metrics, capability detection, report rendering,
        # and the regression gate without torch/easyocr or the release binary. ~keep
        run: uv run pytest python/tests -q
