version: "3"

tasks:
  build:
    # Assumes the tools/ dev crate is named sceptre-tools; it is a workspace member but
    # excluded from default-members. ~keep
    desc: Build the sceptre-tools dev crate
    cmds:
      - cargo build -p sceptre-tools

  run:
    desc: Run the sceptre-tools dev crate (forwards extra CLI args)
    cmds:
      - cargo run -p sceptre-tools -- {{.CLI_ARGS}}
