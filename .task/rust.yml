version: "3"

tasks:
  build:
    desc: Build the Rust workspace
    cmds:
      - cargo build --workspace

  test:
    desc: Run the Rust workspace test suite
    cmds:
      - cargo test --workspace

  fmt:
    desc: Format all Rust code
    cmds:
      - cargo fmt --all

  clippy:
    desc: Lint Rust code with clippy (deny warnings)
    cmds:
      - cargo clippy --workspace --all-targets --tests -- -D warnings

  bench:
    desc: Run the criterion microbenchmarks for the sceptre hot paths
    cmds:
      - cargo bench -p sceptre --features bench

  check:
    desc: Run fmt check, clippy, and the test suite for the Rust workspace
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --tests -- -D warnings
      - cargo test --workspace

  release:build:
    desc: Build the release CLI binary with a bundled ONNX Runtime
    cmds:
      - cargo build --release -p sceptre-cli --no-default-features --features ort-bundled,download

  release:dry-run:
    desc: Validate that the library packages cleanly for crates.io, without publishing
    cmds:
      # Only the library can be dry-run-published: cargo resolves sceptre-cli's `sceptre`
      # dependency from crates.io, where 0.1.0 does not exist yet, so a cli dry-run fails
      # with "no matching package named sceptre". The cli's publish packaging is validated
      # at real-publish time (after the lib lands); its build is covered by release:build. ~keep
      # ort-dynamic (not ort-bundled) avoids downloading the ONNX Runtime during the check. ~keep
      - cargo publish --dry-run -p sceptre --no-default-features --features ort-dynamic,download
