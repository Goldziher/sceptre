version: "3"

tasks:
  build:
    desc: Build the Rust workspace
    cmds:
      - cargo build --workspace

  test:
    desc: Run the Rust workspace test suite
    cmds:
      - cargo test --workspace

  fmt:
    desc: Format all Rust code
    cmds:
      - cargo fmt --all

  clippy:
    desc: Lint Rust code with clippy (deny warnings)
    cmds:
      - cargo clippy --workspace --all-targets --tests -- -D warnings

  bench:
    desc: Run the criterion microbenchmarks for the sceptre hot paths
    cmds:
      - cargo bench -p sceptre --features bench

  verify:features:
    desc: Assert the CLI's ONNX Runtime provisioning feature matrix resolves as intended
    cmds:
      - bash scripts/verify-features.sh

  check:
    desc: Run fmt check, clippy, the feature-matrix gate, and the test suite for the Rust workspace
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --tests -- -D warnings
      - task: verify:features
      - cargo test --workspace

  release:build:
    desc: Build the release CLI binary with a bundled ONNX Runtime
    cmds:
      - cargo build --release -p sceptre-cli --no-default-features --features ort-bundled,download

  release:package:
    desc: Build and archive the self-contained release CLI binary for TRIPLE (e.g. TRIPLE=x86_64-unknown-linux-gnu)
    requires:
      vars: [TRIPLE]
    cmds:
      # ort-bundled links ONNX Runtime statically, so the archive is a self-contained binary. ~keep
      - cargo build --release -p sceptre-cli --no-default-features --features ort-bundled,download --target {{.TRIPLE}}
      - bash scripts/package-release.sh {{.TRIPLE}}

  release:dry-run:
    desc: Validate that both crates package cleanly for crates.io, without publishing
    cmds:
      # ort-dynamic (not ort-bundled) avoids downloading the ONNX Runtime during the check. ~keep
      - cargo publish --dry-run -p sceptre --no-default-features --features ort-dynamic,download
      # sceptre-cli resolves its `sceptre` dependency from crates.io, so this only works
      # once the matching library version is published there. ~keep
      - cargo publish --dry-run -p sceptre-cli --no-default-features --features ort-dynamic,download
