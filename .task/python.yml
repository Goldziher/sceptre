version: "3"

tasks:
  sync:
    desc: Sync the Python dev environment via uv
    cmds:
      - uv sync

  lint:
    desc: Lint Python code with ruff
    cmds:
      - uv run ruff check python

  format:
    desc: Format Python code with ruff
    cmds:
      - uv run ruff format python

  test:
    desc: Run the Python unit tests (pure harness logic; no torch/easyocr needed)
    cmds:
      - uv run pytest python/tests -q

  export:
    desc: >-
      Primary model-export path (ADR 0025): converts EasyOCR CRAFT + gen2 CRNN checkpoints
      to the ONNX artifacts hosted on the sceptre-ocr HF org, and (re)writes the charset
      assets; requires the opt-in export/torch dependency group
    cmds:
      - uv run python -m sceptre_rs_tools.export

  golden:
    desc: >-
      Generate golden JSON fixtures for parity testing (currently stubbed); requires
      the opt-in export/torch dependency group to produce real output
    cmds:
      - uv run python -m sceptre_rs_tools.golden

  benchmark:
    desc: >-
      Head-to-head benchmark of sceptre (release CLI) vs upstream EasyOCR over the
      image corpus (forwards extra CLI args, e.g. --group/--limit/--repeats/--baseline);
      requires the opt-in export/torch group and a built release binary
    cmds:
      - uv run python -m sceptre_rs_tools.benchmark {{.CLI_ARGS}}

  benchmark:check:
    desc: >-
      Head-to-head benchmark with the regression gate (forwards extra CLI args): fails if
      sceptre's warm speedup, peak-RSS ratio, or labeled token-F1 falls below the floors
      in benchmark.py
    cmds:
      - uv run python -m sceptre_rs_tools.benchmark --assert {{.CLI_ARGS}}
