version: "3"

dir: docs-site

tasks:
  dev:
    desc: Run the docs site in dev mode
    cmds:
      - pnpm --dir docs-site install
      - pnpm --dir docs-site dev

  serve:
    desc: Serve the docs site locally with live reload
    cmds:
      - pnpm --dir docs-site install
      - pnpm --dir docs-site dev

  build:
    desc: Install dependencies and build the docs site
    cmds:
      - pnpm --dir docs-site install --frozen-lockfile
      - pnpm --dir docs-site build

  build:strict:
    desc: Build the docs site the way CI does (astro build fails on errors)
    cmds:
      - pnpm --dir docs-site install --frozen-lockfile
      - pnpm --dir docs-site build

  preview:
    desc: Preview the built docs site
    cmds:
      - pnpm --dir docs-site preview

  lint:links:
    desc: Check links with lychee
    cmds:
      - lychee --offline docs-site/src/content/docs README.md

  lint:prose:
    desc: Lint prose with textlint
    cmds:
      - npx textlint 'docs-site/src/content/docs/**/*.{md,mdx}'
